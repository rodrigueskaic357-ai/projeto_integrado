<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparatrip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO / NAVEGAÇÃO -->
  <header class="nav">
    <div class="logo">
      <span>✈ Comparatrip</span>
      
    </div>
    <nav class="menu">
      <a href="#" class="active">Home</a>
      <a href="#">Destinos</a>
      <a href="#">Ofertas</a>
      <a href="#">Sobre nós</a>

    </nav>
    <div class="header-actions">
      <span class="search-icon">🔍</span>
      <button class="btn-conta">👤 Conta</button>
    </div>
  </header>

  <!-- BANNER PRINCIPAL COM BUSCA -->
  <section class="hero">
    <h1>Sua Próxima <br><span class="peppa">aventura</span> começa aqui!</h1>

    <!-- BARRA DE PESQUISA -->
    <div class="joao">
      <div class="input-card">
        <span class="icon">✈️</span>
        <div>
          <strong>Origem</strong>
          <p>De onde você sai?</p>
        </div>
      </div>

      <div class="input-card">
        <span class="icon">📍</span>
        <div>
          <strong>Destino</strong>
          <p>Para onde quer ir?</p>
        </div>
      </div>

      <div class="input-card">
        <span class="icon">📅</span>
        <div>
          <strong>Data</strong>
          <p>Selecione as datas</p>
        </div>
      </div>

      <div class="input-card">
        <span class="icon">👤</span>
        <div>
          <strong>Pessoas</strong>
          <p>Quantas pessoas?</p>
        </div>
      </div>

      <button class="isabela">🔍 Buscar</button>
    </div>
  </section>

  <!-- SEÇÃO DE VIAGENS EM DESTAQUE -->
  <section class="destaques">
    <h2>Viagens em destaque:</h2>

    <div class="cards-container">
      <!-- Card França -->
      <div class="card card-franca">
        <div class="card-title">📍 França</div>
        <button class="btn-arrow">→</button>
      </div>

      <!-- Card Rio de Janeiro -->
      <div class="card card-rio">
        <div class="card-title">📍 Rio de janeiro</div>
        <button class="btn-arrow">→</button>
      </div>

      <!-- Card Ilhas Salomão -->
      <div class="card card-salomao">
        <div class="card-title">📍 Ilhas Salomão</div>
        <button class="btn-arrow">→</button>
      </div>
    </div>
  </section>

</body>
</html>
