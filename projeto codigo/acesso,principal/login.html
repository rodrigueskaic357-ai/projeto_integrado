<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparatrip - Entrar</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-wrapper">
    <section class="login-card">
      
      <!-- Logo da Empresa -->
      <header class="brand">
        <div class="brand-logo">
          <span class="icon-plane">✈</span>
        </div>
        <h1 class="brand-name">compara<span>trip</span></h1>
      </header>

      <!-- Formulário de Acesso -->
      <form class="login-form">
        
        <!-- Campo de Usuário -->
        <div class="input-field">
          <span class="field-icon user-icon"></span>
          <input type="text" id="username" placeholder="Digite seu usuário" required>
        </div>

        <!-- Campo de Senha -->
        <div class="input-field">
          <span class="field-icon lock-icon"></span>
          <input type="password" id="password" placeholder="Digite sua senha" required>
          <button type="button" class="btn-toggle-pass" aria-label="Mostrar ou ocultar senha" onclick="togglePasswordVisibility()">
            <span id="eyeIcon" class="eye-symbol">👁</span>
          </button>
        </div>

        <!-- Botão de Login -->
        <button type="submit" class="btn-primary">Entrar</button>

      </form>

      <!-- Rodapé / Cadastro -->
      <footer class="login-footer">
        <p>Não tem conta? <a href="#">cadastre-se</a></p>
      </footer>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
